name: Verify Headquarters

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: TypeScript and production build
        run: npm run build

      - name: Package verified source
        run: tar --exclude=.git --exclude=node_modules -czf headquarters-source.tgz .

      - name: Upload verified source
        uses: actions/upload-artifact@v4
        with:
          name: headquarters-source
          path: headquarters-source.tgz
          retention-days: 1
