name: Restore package lock

on:
  push:
    branches: [restore-package-lock]
    paths:
      - '.github/workflows/restore-package-lock.yml'

permissions:
  contents: write

jobs:
  restore-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restore-package-lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Generate package lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "Generate package lock from restored package manifest"
          git push origin HEAD:restore-package-lock
