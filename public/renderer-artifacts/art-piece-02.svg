<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="art02-title art02-desc">
  <title id="art02-title">Moonshadow Renderer Test 02</title>
  <desc id="art02-desc">A vertical reel-style frame with a bright explosion core and arc trail representing explosion packet output.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <radialGradient id="blast" cx="50%" cy="55%" r="38%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="35%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#night)"/>
  <rect x="180" y="1140" width="720" height="470" rx="26" fill="#0f172a" stroke="#475569" stroke-width="4"/>
  <circle cx="540" cy="980" r="360" fill="url(#blast)"/>
  <path d="M220 1320 Q540 1080 860 1320" stroke="#facc15" stroke-width="10" fill="none"/>
  <text x="120" y="180" font-family="JetBrains Mono, monospace" font-size="42" fill="#f8fafc" letter-spacing="3">MOONSHADOW RENDER TEST 02</text>
  <text x="120" y="242" font-family="Inter, sans-serif" font-size="28" fill="#fda4af">Explosion packet reel-frame preview</text>
</svg>
